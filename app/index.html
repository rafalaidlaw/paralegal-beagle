<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paralegal Beagle</title>
<link rel="stylesheet" href="app.css">
<script>
  /* Read the theme before the first paint so an explicit choice never
     flashes the system theme first. ?theme= wins, for screenshot checks. */
  try {
    var q = new URLSearchParams(location.search).get("theme");
    var t = q || localStorage.getItem("beagle-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    var d = localStorage.getItem("beagle-density");
    if (d === "compact") document.documentElement.dataset.density = d;
  } catch (e) {}
</script>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="dog">🐕</span>
    <div>
      <h1>Paralegal Beagle</h1>
      <p class="sub">Fall 2026 · Paralegal Accelerated (PLEA)</p>
    </div>
  </div>
  <div class="topright">
    <span class="chip" id="todaychip"></span>
    <button id="theme" class="ghost" title="Theme: follow Windows / light / dark">◐ auto</button>
    <button id="reload" class="ghost" title="Re-read data/ from disk">↻ reload</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-view="week"    class="on">This Week</button>
  <button data-view="grid">Term Grid</button>
  <button data-view="crunch">Crunch</button>
  <button data-view="exams">Exams</button>
  <button data-view="courses">Courses</button>
  <button data-view="notes">Notes</button>
  <button data-view="cases">Cases</button>
  <button data-view="review">Review <span class="badge" id="reviewcount"></span></button>
</nav>

<main id="main"><p class="muted pad">loading…</p></main>

<footer class="foot">
  <span id="footstats"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
