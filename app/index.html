<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paralegal Beagle</title>
<meta name="theme-color" content="#f3f2f2">
<link rel="stylesheet" href="app.css">
<script>
  /* Read the theme before the first paint so an explicit choice never
     flashes the other state. ?theme= wins, for screenshot checks. */
  try {
    var q = new URLSearchParams(location.search).get("theme");
    var t = q || localStorage.getItem("beagle-theme") || "light";   /* light is the default; "auto" follows Windows */
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
  /* The address bar is the one surface no stylesheet can reach, so the meta
     has to be kept in step by hand. Set before first paint here, and again in
     paintChrome() whenever the toggle moves. */
  try {
    var dark = document.documentElement.dataset.theme === "dark"
      || (!document.documentElement.dataset.theme
          && matchMedia("(prefers-color-scheme: dark)").matches);
    document.querySelector('meta[name="theme-color"]').content = dark ? "#161514" : "#f3f2f2";
  } catch (e) {}
</script>
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="brand">
      <div class="name">Paralegal <br>Beagle</div>
      <div class="sub">Fall 2026 · PLEA accelerated</div>
    </div>

    <div class="nowblock">
      <span class="lbl" id="wk-lbl">Current week</span>
      <div class="big"><b id="wk-big">—</b><span id="wk-of">of 15</span></div>
      <div class="range" id="wk-range"></div>
    </div>

    <nav class="nav" id="nav" aria-label="Views">
      <a href="#grid" data-view="grid"><span class="lab">Weekly Calendar</span> <span class="count" data-count="grid"></span></a>
      <a href="#week" data-view="week"><span class="lab">Upcoming</span> <span class="count" data-count="week"></span></a>
      <!-- Deadlines switched off 26 Sep 2026. Upcoming carries the fortnight and
           the Weekly Calendar carries the whole term, so it was a third list of
           the same items. To bring it back, un-comment this line AND add
           "deadlines" to SHOWN in app.js.
      <a href="#deadlines" data-view="deadlines">Deadlines <span class="count" data-count="deadlines"></span></a>
      -->
      <a href="#timetable" data-view="timetable"><span class="lab">Timetable</span> <span class="count" data-count="timetable"></span></a>
      <!-- Cut to three screens on 24 Sep 2026. These five still work; to bring
           one back, un-comment its line here AND add its name to SHOWN in app.js.
      <a href="#crunch" data-view="crunch">Crunch <span class="count" data-count="crunch"></span></a>
      <a href="#courses" data-view="courses">Courses <span class="count" data-count="courses"></span></a>
      <span class="lbl grp">My work</span>
      <a href="#notes" data-view="notes">Notes <span class="count" data-count="notes"></span></a>
      <a href="#cases" data-view="cases">Cases <span class="count" data-count="cases"></span></a>
      <a href="#review" data-view="review">Review <span class="count" data-count="review"></span></a>
      -->
    </nav>

    <div class="sidefoot">
      <div class="row">
        <button id="theme" class="flex" title="Theme: follow Windows / light / dark">◐ Auto</button>
      </div>
      <div class="footstats" id="footstats"></div>
    </div>
  </aside>

  <main>
    <header class="mhead">
      <div>
        <h1 id="vtitle">Paralegal Beagle</h1>
        <p class="subtitle" id="vsub">loading…</p>
      </div>
      <div class="today" id="todaychip"></div>
    </header>
    <div id="main"><p class="pad muted">loading…</p></div>
  </main>

</div>
<!-- The detail sheet slides up over everything, so it sits outside .app rather
     than inside a screen that scrolls. Empty until something is tapped. -->
<div id="sheet"></div>
<script src="app.js"></script>
</body>
</html>
